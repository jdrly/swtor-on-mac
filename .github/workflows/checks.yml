# Checks every pull request and every push to main: the scripts and workflows lint clean, and
# the app builds. No secrets and read-only access; signing and notarizing happen only in
# release.yml. (The installer's end-to-end test, scripts/test-sandbox.sh, needs the official
# SWTOR Mac app installed, so it runs on a developer's Mac, not here.)
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

      - name: actionlint
        run: |
          v=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "$sha  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  build:
    runs-on: macos-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts run under macOS's /bin/bash 3.2, so check their syntax with that one.
      - name: Syntax (bash 3.2)
        run: git ls-files -z '*.sh' | xargs -0 -n 1 /bin/bash -n

      - name: Build
        run: ./build.sh

      - name: Check the app
        run: |
          app="dist/SWTOR on Mac.app"
          find "$app" -name Info.plist -print0 | xargs -0 plutil -lint -s
          for f in Contents/MacOS/SWTORonMac Contents/Resources/som.sh Contents/Resources/wine-wrapper.sh \
                   Contents/Resources/helpers/hold-launcher Contents/Resources/helpers/setsid-exec \
                   Contents/Resources/d9mt/d3d9.dll Contents/Resources/d9mt/winemetal.so \
                   Contents/Resources/collect-logs.sh Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle \
                   Contents/Resources/Licenses/d9mt/bridge/COPYING.LIB Contents/Resources/Licenses/sparkle/LICENSE; do
            [ -e "$app/$f" ] || { echo "missing: $f"; exit 1; }
          done
          for h in "$app/Contents/Resources/helpers/"*; do
            [ "$(lipo -archs "$h")" = "x86_64 arm64" ] || { echo "not universal: $h"; exit 1; }
          done
          # the window runs on macOS 26: every Mach-O must allow it (Sparkle's say older)
          bad=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q '^Mach-O' || continue
            m="$(vtool -show-build "$f" 2>/dev/null | awk '/minos/ { print $2; exit }')"
            [ -n "$m" ] && [ "${m%%.*}" -le 26 ] || { echo "needs macOS $m: ${f#"$app"/}"; bad=1; }
          done < <(find "$app" -type f -print0)
          exit "$bad"

      - name: Installer status in an empty sandbox
        run: |
          out="$(SWTOR_ON_MAC_ROOT="$RUNNER_TEMP/sandbox" "dist/SWTOR on Mac.app/Contents/Resources/som.sh" status)"
          echo "$out"
          grep -qx 'official_app=no' <<<"$out"
          ! SWTOR_ON_MAC_ROOT="$RUNNER_TEMP/sandbox" "dist/SWTOR on Mac.app/Contents/Resources/som.sh" install
