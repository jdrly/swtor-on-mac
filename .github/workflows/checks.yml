# Checks every pull request and every push to main: the scripts and workflows lint clean, the
# d9mt pin is green on d9mt's main, and the app builds. No secrets and read-only access; no workflow
# signs, notarizes or builds a release (docs/building.md, *Releasing*). (The installer's end-to-end test, scripts/test-sandbox.sh, needs the official
# SWTOR Mac app installed, so it runs on a developer's Mac, not here; its fixture groups,
# scripts/test-fixtures.sh, need neither that app nor Wine and run here on the built app.)
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

      - name: actionlint
        run: |
          v=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "$sha  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # The d9mt pin (scripts/build-d9mt.sh's COMMIT, prebuilt/d9mt/VERSION) is a commit of d9mt's
  # main that d9mt's own Checks workflow passed: scripts/check-d9mt-pin.sh. It reads the public
  # jdrly/d9mt through the API with this run's read-only token. A d9mt run that is still going
  # is waited for. Exit status 2 means GitHub didn't answer or the run didn't finish in time:
  # that is no verdict on the pin, and the job says so.
  d9mt-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The d9mt pin is green on d9mt's main
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-d9mt-pin.sh --wait 45

  build:
    # build.sh needs the macOS 27 SDK. GitHub has no macos-27 label; its macOS 27 image with
    # Xcode 27 (the default /Applications/Xcode.app) is xcode-27, a public preview
    # (actions/runner-images#14404; .github/actionlint.yaml lists it). macos-26 has only
    # Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts run under macOS's /bin/bash 3.2, so check their syntax with that one.
      - name: Syntax (bash 3.2)
        run: git ls-files -z '*.sh' | xargs -0 -n 1 /bin/bash -n

      - name: Build
        run: ./build.sh

      - name: Check the app
        run: |
          app="dist/SWTOR on Mac.app"
          find "$app" -name Info.plist -print0 | xargs -0 plutil -lint -s
          for f in Contents/MacOS/SWTORonMac Contents/Resources/som.sh Contents/Resources/wine-wrapper.sh \
                   Contents/Resources/helpers/hold-launcher Contents/Resources/helpers/setsid-exec \
                   Contents/Resources/d9mt/d3d9.dll Contents/Resources/d9mt/winemetal.so \
                   Contents/Resources/wine/winemac.so Contents/Resources/wine/ntdll.so Contents/Resources/Licenses/winemac/COPYING.LIB \
                   Contents/Resources/Licenses/ntdll/COPYING.LIB Contents/Resources/Licenses/fonts/Unbounded-OFL.txt \
                   Contents/Resources/Licenses/fonts/JetBrainsMono-OFL.txt \
                   Contents/Resources/collect-logs.sh Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle \
                   Contents/Resources/Licenses/d9mt/bridge/COPYING.LIB Contents/Resources/Licenses/sparkle/LICENSE \
                   Contents/Resources/Licenses/SWTOR-on-Mac-LICENSE.txt Contents/Resources/Licenses/THIRD_PARTY_NOTICES.md; do
            [ -e "$app/$f" ] || { echo "missing: $f"; exit 1; }
          done
          for h in "$app/Contents/Resources/helpers/"*; do
            [ "$(lipo -archs "$h")" = "x86_64 arm64" ] || { echo "not universal: $h"; exit 1; }
          done
          # the window runs on macOS 26: every Mach-O must allow it (Sparkle's say older)
          bad=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q '^Mach-O' || continue
            m="$(vtool -show-build "$f" 2>/dev/null | awk '/minos/ { print $2; exit }')"
            if [ -z "$m" ] || [ "${m%%.*}" -gt 26 ]; then echo "needs macOS $m: ${f#"$app"/}"; bad=1; fi
          done < <(find "$app" -type f -print0)
          exit "$bad"

      - name: Installer status in an empty sandbox
        run: |
          out="$(SWTOR_ON_MAC_ROOT="$RUNNER_TEMP/sandbox" "dist/SWTOR on Mac.app/Contents/Resources/som.sh" status)"
          echo "$out"
          grep -qx 'official_app=no' <<<"$out"
          # (refuses: no official install)
          if SWTOR_ON_MAC_ROOT="$RUNNER_TEMP/sandbox" "dist/SWTOR on Mac.app/Contents/Resources/som.sh" install; then exit 1; fi
          # the Play button: never the real app, in a sandbox without an official app
          play="$(SWTOR_ON_MAC_ROOT="$RUNNER_TEMP/sandbox" "dist/SWTOR on Mac.app/Contents/MacOS/SWTORonMac" --play-target)"
          echo "$play"
          grep -q '^unavailable The official SWTOR app was not found' <<<"$play"

      # The fixture groups (all of them, with their negative controls) on the packaged app, in a
      # new root of their own; the script removes it after a pass and keeps it after a failure.
      - name: fixtures
        run: FIXTURE_ROOT="$RUNNER_TEMP/fixtures" scripts/test-fixtures.sh "dist/SWTOR on Mac.app"

      # The update window through a whole update (scripts/ui-snapshot.sh updateflow): here on
      # macOS 27, and built here for the update-window job on macOS 26, where the window once
      # aborted the app.
      - name: Update window (macOS 27)
        run: |
          scripts/ui-snapshot.sh updateflow "$RUNNER_TEMP/update-window/macos-27"
          tar -C .cache/ui-snapshot -czf "$RUNNER_TEMP/ui-snapshot.tgz" UISnapshot.app
          tar -C dist -czf "$RUNNER_TEMP/app.tgz" "SWTOR on Mac.app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshot
          path: |
            ${{ runner.temp }}/ui-snapshot.tgz
            ${{ runner.temp }}/app.tgz
          retention-days: 3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: update-window-macos-27
          path: ${{ runner.temp }}/update-window/macos-27
          retention-days: 7
          if-no-files-found: ignore

  # The update window on macOS 26 (the app's minimum), with the harness the build job compiled
  # against the macOS 27 SDK, as the app is: there it once ended the app with an uncaught
  # NSException in AppKit's layout pass.
  update-window:
    needs: build
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-snapshot
          path: ${{ runner.temp }}

      - name: Update window (macOS 26)
        run: |
          sw_vers
          tar -xzf "$RUNNER_TEMP/ui-snapshot.tgz" -C "$RUNNER_TEMP"
          clang -fobjc-arc -framework Foundation -framework CoreGraphics -o "$RUNNER_TEMP/retina-display" scripts/retina-display.m
          snap="$RUNNER_TEMP/UISnapshot.app/Contents/MacOS/ui-snapshot"
          echo "=== 1x"
          "$snap" updateflow "$RUNNER_TEMP/update-window/macos-26-1x"
          # EXPERIMENT: the real app (sandbox) with a local feed offering 9.9.9, per display size
          tar -xzf "$RUNNER_TEMP/app.tgz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/feed"
          cat >"$RUNNER_TEMP/feed/appcast.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
          <channel><title>test</title>
          <item><title>9.9.9</title><sparkle:version>9.9.9</sparkle:version><sparkle:shortVersionString>9.9.9</sparkle:shortVersionString>
          <description><![CDATA[<h2>Test</h2><ul><li>One change.</li><li>Another change.</li></ul>]]></description>
          <enclosure url="http://127.0.0.1:8000/x.dmg" length="1000" type="application/octet-stream" sparkle:edSignature="AAAA"/>
          </item></channel></rss>
          XML
          (cd "$RUNNER_TEMP/feed" && exec python3 -m http.server 8000 --bind 127.0.0.1) >/dev/null 2>&1 &
          app="$RUNNER_TEMP/SWTOR on Mac.app/Contents/MacOS/SWTORonMac"
          for size in "1024 666" "1280 832" "1470 956"; do
            echo "=== app, Retina $size"
            # shellcheck disable=SC2086
            "$RUNNER_TEMP/retina-display" $size >"$RUNNER_TEMP/rd.out" &
            rd=$!
            for _ in $(seq 50); do grep -q '' "$RUNNER_TEMP/rd.out" && break; sleep 0.2; done
            cat "$RUNNER_TEMP/rd.out"
            d=cz.jandrly.swtoronmac
            defaults write $d SWTORUpdateFeedURL http://127.0.0.1:8000/appcast.xml
            defaults write $d acceptedNotice -bool true
            defaults write $d SUHasLaunchedBefore -bool true
            defaults write $d SULastCheckTime -date "2020-01-01 00:00:00 +0000"
            defaults delete $d SUSkippedVersion 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/sandbox"; mkdir -p "$RUNNER_TEMP/sandbox"
            SWTOR_ON_MAC_ROOT="$RUNNER_TEMP/sandbox" "$app" >"$RUNNER_TEMP/app.log" 2>&1 &
            a=$!
            for _ in $(seq 45); do kill -0 "$a" 2>/dev/null || break; sleep 1; done
            if kill -0 "$a" 2>/dev/null; then echo "app still running after 45 s"; screencapture -x "$RUNNER_TEMP/update-window/app-${size// /x}.png" || true; kill "$a"; wait "$a" || true
            else wait "$a"; echo "APP EXITED: $?"; fi
            grep -E "SWTOR on Mac:|Terminating|reason|exception" "$RUNNER_TEMP/app.log" | head -20
            kill "$rd"; wait "$rd" || true
          done
          find ~/Library/Logs/DiagnosticReports -name 'SWTORonMac*' 2>/dev/null
          mkdir -p "$RUNNER_TEMP/update-window"
          echo "=== harness, Retina 1024 666"
          "$RUNNER_TEMP/retina-display" 1024 666 >"$RUNNER_TEMP/rd.out" &
          rd=$!
          sleep 3; cat "$RUNNER_TEMP/rd.out"
          "$snap" updateflow "$RUNNER_TEMP/update-window/macos-26-1024x666" || echo "HARNESS EXITED: $?"
          kill "$rd"; wait "$rd" || true
          for size in "1470 956" "1280 832"; do
            echo "=== Retina $size"
            # shellcheck disable=SC2086
            "$RUNNER_TEMP/retina-display" $size >"$RUNNER_TEMP/rd.out" &
            rd=$!
            for _ in $(seq 50); do grep -q '' "$RUNNER_TEMP/rd.out" && break; sleep 0.2; done
            cat "$RUNNER_TEMP/rd.out"
            grep -q '^ready' "$RUNNER_TEMP/rd.out"
            status=0
            "$snap" updateflow "$RUNNER_TEMP/update-window/macos-26-${size// /x}" || status=$?
            kill "$rd"; wait "$rd" || true
            [ "$status" = 0 ] || { echo "updateflow ended with $status"; exit "$status"; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: update-window-macos-26
          path: ${{ runner.temp }}/update-window
          retention-days: 7
          if-no-files-found: ignore
