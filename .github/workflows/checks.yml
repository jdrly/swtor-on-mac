# Checks every pull request and every push to main: the scripts and workflows lint clean, the
# d9mt pin is green on d9mt's main, the Mullion pin on my fork's swtor-on-mac, and the app
# builds. No secrets and read-only access; signing and notarizing happen only in release.yml.
# (The installer's end-to-end test, scripts/test-sandbox.sh, needs the official SWTOR Mac app
# installed, so it runs on a developer's Mac, not here; its fixture groups,
# scripts/test-fixtures.sh, need neither that app nor Wine and run here on the built app.)
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

      - name: actionlint
        run: |
          v=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "$sha  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # The d9mt pin (scripts/build-d9mt.sh's COMMIT, prebuilt/d9mt/VERSION) is a commit of d9mt's
  # main that d9mt's own Checks workflow passed: scripts/check-d9mt-pin.sh. It reads the public
  # jdrly/d9mt through the API with this run's read-only token. A d9mt run that is still going
  # is waited for. Exit status 2 means GitHub didn't answer or the run didn't finish in time:
  # that is no verdict on the pin, and the job says so.
  d9mt-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The d9mt pin is green on d9mt's main
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-d9mt-pin.sh --wait 45

  # The Mullion pin (MULLION_* in src/som.sh) is a commit of my fork's swtor-on-mac branch, its
  # asset is the one pinned, and the fork's SWTOR workflow has a green push run of that commit:
  # scripts/check-mullion-pin.sh, the same way as the d9mt pin, with the same exit statuses.
  mullion-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The Mullion pin is green on the fork's swtor-on-mac
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-mullion-pin.sh --wait 45

  build:
    # build.sh needs the macOS 27 SDK. GitHub has no macos-27 label; its macOS 27 image with
    # Xcode 27 (the default /Applications/Xcode.app) is xcode-27, a public preview
    # (actions/runner-images#14404; .github/actionlint.yaml lists it). macos-26 has only
    # Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts run under macOS's /bin/bash 3.2, so check their syntax with that one.
      - name: Syntax (bash 3.2)
        run: git ls-files -z '*.sh' | xargs -0 -n 1 /bin/bash -n

      - name: Build
        run: ./build.sh

      # Pull requests into dx12: a development build's window compiles too. The release build
      # above leaves out its #if SWTOR_DEV code, such as Settings' DirectX 12 section. Only the
      # compile (unoptimized, with the Sparkle the build above fetched); dist/ stays the release
      # app. The version only makes it a development build.
      - name: Development build compiles (dx12)
        if: github.base_ref == 'dx12'
        run: SWTOR_ON_MAC_COMPILE_ONLY=1 SWTOR_ON_MAC_VERSION=0.0.1-dev.1 ./build.sh

      - name: Check the app
        run: |
          app="dist/SWTOR on Mac.app"
          find "$app" -name Info.plist -print0 | xargs -0 plutil -lint -s
          for f in Contents/MacOS/SWTORonMac Contents/Resources/som.sh Contents/Resources/wine-wrapper.sh \
                   Contents/Resources/helpers/hold-launcher Contents/Resources/helpers/setsid-exec \
                   Contents/Resources/d9mt/d3d9.dll Contents/Resources/d9mt/winemetal.so \
                   Contents/Resources/wine/winemac.so Contents/Resources/wine/ntdll.so Contents/Resources/Licenses/winemac/COPYING.LIB \
                   Contents/Resources/Licenses/ntdll/COPYING.LIB Contents/Resources/Licenses/fonts/Unbounded-OFL.txt \
                   Contents/Resources/Licenses/fonts/JetBrainsMono-OFL.txt \
                   Contents/Resources/collect-logs.sh Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle \
                   Contents/Resources/Licenses/d9mt/bridge/COPYING.LIB Contents/Resources/Licenses/sparkle/LICENSE \
                   Contents/Resources/Licenses/SWTOR-on-Mac-LICENSE.txt Contents/Resources/Licenses/THIRD_PARTY_NOTICES.md; do
            [ -e "$app/$f" ] || { echo "missing: $f"; exit 1; }
          done
          for h in "$app/Contents/Resources/helpers/"*; do
            [ "$(lipo -archs "$h")" = "x86_64 arm64" ] || { echo "not universal: $h"; exit 1; }
          done
          # the window runs on macOS 26: every Mach-O must allow it (Sparkle's say older)
          bad=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q '^Mach-O' || continue
            m="$(vtool -show-build "$f" 2>/dev/null | awk '/minos/ { print $2; exit }')"
            if [ -z "$m" ] || [ "${m%%.*}" -gt 26 ]; then echo "needs macOS $m: ${f#"$app"/}"; bad=1; fi
          done < <(find "$app" -type f -print0)
          exit "$bad"

      - name: Installer status in an empty sandbox
        run: |
          out="$(SWTOR_ON_MAC_ROOT="$RUNNER_TEMP/sandbox" "dist/SWTOR on Mac.app/Contents/Resources/som.sh" status)"
          echo "$out"
          grep -qx 'official_app=no' <<<"$out"
          # (refuses: no official install)
          if SWTOR_ON_MAC_ROOT="$RUNNER_TEMP/sandbox" "dist/SWTOR on Mac.app/Contents/Resources/som.sh" install; then exit 1; fi
          # the Play button: never the real app, in a sandbox without an official app
          play="$(SWTOR_ON_MAC_ROOT="$RUNNER_TEMP/sandbox" "dist/SWTOR on Mac.app/Contents/MacOS/SWTORonMac" --play-target)"
          echo "$play"
          grep -q '^unavailable The official SWTOR app was not found' <<<"$play"

      # The pinned download the dx12-mullion group tests against (the engine, 235 MB; Mullion's
      # archives there are stand-ins it makes), in .cache/<sha256>/ where the group keeps it:
      # restored while the pin stays the same, saved after a run that passed. Only that folder:
      # the rest of .cache is build output (compile-check).
      - name: Pinned downloads for the fixtures
        id: pins
        run: echo "engine=$(sed -n 's/^ENGINE_SHA256=//p' src/som.sh)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/${{ steps.pins.outputs.engine }}
          key: fixtures-${{ steps.pins.outputs.engine }}

      # The fixture groups (all of them, with their negative controls) on the packaged app, in a
      # new root of their own; the script removes it after a pass and keeps it after a failure.
      - name: fixtures
        run: FIXTURE_ROOT="$RUNNER_TEMP/fixtures" scripts/test-fixtures.sh "dist/SWTOR on Mac.app"
