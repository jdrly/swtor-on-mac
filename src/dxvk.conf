# d9mt front-end options (DXVK's config format), read via DXVK_CONFIG_FILE from
# ~/Library/Application Support/SWTOR on Mac/env. Written by SWTOR on Mac at install.

# SWTOR asks for "present immediately" in borderless mode, which tears. Force vsync.
d3d9.presentInterval = 1

# Accept HWVP vertex shaders whose only float constants >= 256 are def immediates
# (SWTOR creates 4 such shaders: "Invalid VS float constant index 305").
d3d9.allowOutOfRangeVsDefs = True
